name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Include the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: input
    id: where
    attributes:
      label: Where?
      description: Live site (trackyourapplication.vercel.app) or your own local copy? Browser and device?
      placeholder: Live site, Chrome on Windows
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Please hide any personal data first.
